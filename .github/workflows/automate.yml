name: Automate Preprocessing
on:
  push:
    branches:
      - main
      - master

jobs:
  preprocess_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn

      - name: Run Automation Script
        run: |
          cd preprocessing
          python automate_Rizka_Aulia_Fauziah.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add preprocessing/dataset_preprocessing/
          # Mencegah error jika tidak ada perubahan data
          git commit -m "Auto-update: Hasil preprocessing terbaru" -a || echo "No changes to commit"
          git push